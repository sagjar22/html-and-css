<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заннятя 13 - Форми </title>
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="../shared_resources/favicon.jpg">
</head>

<body>
    <p>Форма - це набір керування, який дозволяє веб додатку взаємодіяти з користувачем </p>
    <p class="decoration">Пошук (поле введення пошукового запиту)</p>
    <p class="decoration"></p>


    <form action="/register" method="post">
        <h2>Реєстрація</h2>
        <label for="username">Ім'я користувача: </label>
        <input type="text" name="username" id="username">
        <br>
        <label for="email">Електрона пошта: </label>
        <input type="email" name="email" id="eamil">
        <label for="password">Пароль: </label>
        <input type="password" name="password" id="password">
        <br>
        <label for="about">Про себе</label>
        <br>
        <textarea name="about" id="about">Sven kill who doesn`t have counter pick</textarea>
        <br>
        <label for="agree">Я соглашаюсь с тем что ПЛ дерьмо вонючее</label>
        <input type="checkbox" name="agree" id="agree">
        
        <fieldset>
            <legend>Стать</legend>
            <input type="radio" name="gender" id="genderM" value="male">
            <lable for="genderM">Чоловік</lable>
            <input type="radio" name="gender" id="genderF" value="female">
            <lable for="genderM">Жінка</lable>
            <input type="radio" name="gender" id="genderP" value="PL">
            <lable for="genderM">Phantom Lancer</lable>
        </fieldset>
        <br>
        <lable for="fav-char">Улюблений персонаж із дота2: </lable>
        <select name="fav-char" id="fav-char">
            <option value="Phantom Lancer">Phantom Lancer - high coristol</option>
            <option value="Sven">Sven - low coristol</option>
            <option value="Beastmaster">200 игр на бистмастере</option>
            <option value="Wraith King">Wraith King - Папич</option>
        </select>
        <label for="fav-pos">Улюблена позиція в дота2</label>
        <input type="text" name="fav-pos" id="fav-pos" list="positions">
        <details id="positions">
            <option value="third pos - hardlane">3</option>
            <option value="second pos - midlane">2</option>
            <option value="first pos - easylane">1</option>
        </details>
        <br>
        <label for="birth-day">Дата народження</label>
        <input type="date" name="birth-day" id="birth-day">
        <br>
        <label for="link">Соц.мережі</label>
        <input type="url" name="link" id="link">
        <br>
        <label for="tail">Ваш зріст</label>
        <input type="number" name="tail" id="tail">
        <br>
        <input type="submit" value="Зареєструватись">
    </form>

    <form action="/search" method="get">
        <h2>Прошук</h2>
        <input type="text" name="query">
        <input type="submit" value="Пошук">
        <input type="reset" value="Очистити">
    </form>
</body>

</html>
